{% extends "base.html" %}

{% block nav %}
<nav class="site-nav">
    <div id="navbar" class="site-nav-links">
        <a href="/devops/landing_page/">Home</a>
        <a href="/devops/dynamic_gloss">Glossary</a>
        <a href="https://gcallah.pythonanywhere.com/berkeley/">Biblio.</a>
        <a href="/devops/dynamic_about/">About</a>
        {% if user.is_authenticated is False %}
            <a href="{% url 'participant_login' %}">Login</a>
        {% else %}
            <a href="{% url 'participant_logout' %}">Log out</a>
        {% endif %}
    </div>

    <form class="site-search" action="{% url 'devops:parse_search' %}"
        id="search" hidden>
        <input class="site-search-input" name="query" type="search"
            placeholder="Search the course" aria-label="Search">
        <button class="site-search-go" type="submit">Search</button>
    </form>

    <button class="site-search-toggle" id="bt" type="button"
        aria-label="Toggle search">
        <i class="material-icons">search</i>
    </button>
</nav>
{% endblock nav %}

{% block scripts %}
<script src="/static/devops/js/show_searchbar.js"></script>
{% endblock scripts %}
