<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block title %}
        {{ header }}
        {% endblock title %}
    </title>
    {% block stylesheets %}
        <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">
        <!-- bump the ?v= when styles.css changes, so browsers refetch it -->
        <link rel="stylesheet" type="text/css" href="/static/devops/styles.css?v=2">
        <!--Tinymce Text-Editor (Must be in Head Tag) -->
        <script src="{% static 'devops/js/tinymce/tinymce.min.js' %}"></script>
        <script type="text/javascript"
            src="{% static 'devops/js/tinymce/custom.js' %}" ></script>
    {% endblock stylesheets %}
   <script  src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/3.3.0/fuse.min.js">
   </script>

</head>

<body class="dashboard">
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/" class="site-brand">
                <span class="site-brand-mark">&lt;/&gt;</span>
                {{ header }}
            </a>
            {% block nav %}
            <nav id="navbar" class="site-nav">
                <a href="/">Home</a>
                <a href="/devops/gloss">Glossary</a>
                <a href="/devops/about">About</a>
            </nav>
            {% endblock nav %}
        </div>
    </header>

    <main id="content" class="{% block page_class %}page{% endblock page_class %}">
            {% block content %}
            {% endblock content %}
    </main>


    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous">

    </script>
    {% block scripts %}
    {% endblock scripts %}

</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"> </script>
<script>
    $.support.cors = true;
</script>

</html>
